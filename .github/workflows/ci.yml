name: CI

# Branch pushes, pull requests and manual runs. Tag pushes (v*) are not built here: the release workflow
# (release.yml) builds, tests and packages every tagged commit on all three platforms itself.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Committed files must not carry personal paths, account names or session identifiers (audit F20).
  # The patterns are spelled so that this file does not match itself.
  hygiene:
    name: No personal paths in tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan tracked files
        shell: bash
        run: |
          patterns=(
            -e 'Users[\\/]+[A-Za-z0-9_]'
            -e 'C-[-]Users-'
            -e '\blok[i]\b'
            -e 'cross[b]oss'
            -e '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          )
          if git grep -n -I -i -E "${patterns[@]}" -- . ; then
            echo "::error::tracked files contain personal paths, user names or session identifiers (see the lines above); use placeholders such as <scratch>, <corpus> or <diaphora-ref>"
            exit 1
          fi
          echo "no personal paths found"

      # Maintainer notes and binary artefacts (IDA databases, SQLite files, Python bytecode) stay local:
      # the published repository must not track them. The check needs GitHub's environment
      # (GITHUB_REPOSITORY), so running this script in a local working copy, where such notes may be
      # tracked until publication, does not fail.
      - name: No local-only or binary files tracked
        shell: bash
        run: |
          if [ -z "${GITHUB_REPOSITORY:-}" ]; then
            echo "not running on GitHub; skipped"
            exit 0
          fi
          tracked=$(git ls-files -- AGENTS.md 'HANDOFF*.md' JOURNAL.md '*.pyc' '*.i64' '*.idb' '*.sqlite' '*.db')
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            echo "::error::local-only or binary files are tracked (see the list above)"
            exit 1
          fi
          echo "no local-only or binary files tracked"

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
          - name: Windows / MSVC
            os: windows-latest
          # The release's deployment target, so a C++ library feature newer than macOS 13 fails here too.
          - name: macOS / Clang
            os: macos-latest
            osx_target: '13.0'
          # DSIG_VENDORED_SQLITE=OFF: the distribution's SQLite, so the fallback build keeps working and
          # the order-insensitive (L1) comparisons and the SQLite-mismatch warning stay exercised.
          - name: Linux / GCC / system SQLite
            os: ubuntu-latest
            sqlite: system

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ilammy/msvc-dev-cmd@v1 still runs on Node 20; this script does the same with vswhere + vcvars64.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/msvc-dev-env.ps1

      # SQLite 3.51.1 (the parity oracle's) is bundled and built by CMake by default; only the
      # system-SQLite job installs one.
      - name: Install SQLite3 development files (system SQLite job)
        if: matrix.sqlite == 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Configure
        shell: bash
        env:
          SQLITE_MODE: ${{ matrix.sqlite }}
          OSX_TARGET: ${{ matrix.osx_target }}
        run: |
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [ "$SQLITE_MODE" = "system" ]; then
            args+=(-DDSIG_VENDORED_SQLITE=OFF)
          fi
          if [ -n "$OSX_TARGET" ]; then
            args+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=$OSX_TARGET")
          fi
          cmake "${args[@]}"

      - name: Report toolchain
        shell: bash
        run: |
          echo "--- compiler actually selected by CMake ---"
          grep -E "^CMAKE_(C|CXX)_COMPILER:" build/CMakeCache.txt || true
          grep -E "^CMAKE_(C|CXX)_COMPILER_ID:" build/CMakeCache.txt || true
          echo "--- static library naming (MSVC produces .lib, GCC produces .a) ---"
          find build -maxdepth 1 -name "*dsigmatcher_core*" -print || true

      - name: Build
        run: cmake --build build

      - name: Report SQLite
        shell: bash
        run: ./build/dsig_sqlite_info

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Report test binaries
        shell: bash
        run: |
          ./build/dsigmatcher --help
          echo "--- ctest rerun with timing ---"
          ctest --test-dir build --output-on-failure -V 2>&1 | grep -E "checks|checks run|Test #|tests passed" || true
